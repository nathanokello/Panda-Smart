openapi: 3.0.3
info:
  title: Panda Smart API
  version: 1.0.0
  description: Backend for the Panda Smart crop-lifecycle demo (architecture.md).
paths:
  /api/schema/:
    get:
      operationId: api_schema_retrieve
      description: |-
        OpenApi3 schema for this API. Format can be selected via content negotiation.

        - YAML: application/vnd.oai.openapi
        - JSON: application/vnd.oai.openapi+json
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - yaml
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - af
          - ar
          - ar-dz
          - ast
          - az
          - be
          - bg
          - bn
          - br
          - bs
          - ca
          - ckb
          - cs
          - cy
          - da
          - de
          - dsb
          - el
          - en
          - en-au
          - en-gb
          - eo
          - es
          - es-ar
          - es-co
          - es-mx
          - es-ni
          - es-ve
          - et
          - eu
          - fa
          - fi
          - fr
          - fy
          - ga
          - gd
          - gl
          - he
          - hi
          - hr
          - hsb
          - hu
          - hy
          - ia
          - id
          - ig
          - io
          - is
          - it
          - ja
          - ka
          - kab
          - kk
          - km
          - kn
          - ko
          - ky
          - lb
          - lt
          - lv
          - mk
          - ml
          - mn
          - mr
          - ms
          - my
          - nb
          - ne
          - nl
          - nn
          - os
          - pa
          - pl
          - pt
          - pt-br
          - ro
          - ru
          - sk
          - sl
          - sq
          - sr
          - sr-latn
          - sv
          - sw
          - ta
          - te
          - tg
          - th
          - tk
          - tr
          - tt
          - udm
          - ug
          - uk
          - ur
          - uz
          - vi
          - zh-hans
          - zh-hant
      tags:
      - api
      security:
      - {}
      responses:
        '200':
          content:
            application/vnd.oai.openapi:
              schema:
                type: object
                additionalProperties: {}
            application/yaml:
              schema:
                type: object
                additionalProperties: {}
            application/vnd.oai.openapi+json:
              schema:
                type: object
                additionalProperties: {}
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/advice/:
    get:
      operationId: advice_retrieve
      parameters:
      - in: query
        name: crop
        schema:
          type: string
          minLength: 1
        required: true
      - in: query
        name: ward
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - advice
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdviceResponse'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
          description: ''
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      tags:
      - auth
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/crops/:
    get:
      operationId: crops_list
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - crops
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCropList'
          description: ''
  /api/v1/dashboard/wards/:
    get:
      operationId: dashboard_wards_list
      tags:
      - dashboard
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DashboardWardSummary'
          description: ''
  /api/v1/dashboard/wards/{ward_id}/:
    get:
      operationId: dashboard_ward_detail
      parameters:
      - in: path
        name: ward_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - dashboard
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WardDashboard'
          description: ''
  /api/v1/farmers/:
    get:
      operationId: farmers_list
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - farmers
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFarmerList'
          description: ''
    post:
      operationId: farmers_create
      tags:
      - farmers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FarmerCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FarmerCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FarmerCreateRequest'
        required: true
      security:
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FarmerCreate'
          description: ''
  /api/v1/farmers/{id}/:
    get:
      operationId: farmers_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - farmers
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Farmer'
          description: ''
  /api/v1/farmers/{id}/plots/:
    get:
      operationId: farmers_plots_list
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - farmers
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPlotList'
          description: ''
    post:
      operationId: farmers_plots_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - farmers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlotCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PlotCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PlotCreateRequest'
        required: true
      security:
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlotCreate'
          description: ''
  /api/v1/lots/:
    get:
      operationId: lots_list
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - lots
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLotList'
          description: ''
    post:
      operationId: lots_create
      tags:
      - lots
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LotRegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LotRegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LotRegisterRequest'
        required: true
      security:
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LotRegister'
          description: ''
  /api/v1/lots/{lot_id}/:
    get:
      operationId: lots_retrieve
