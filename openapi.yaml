              schema:
                $ref: '#/components/schemas/Lot'
          description: ''
  /api/v1/lots/{lot_id}/events/:
    get:
      operationId: lots_events_list
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: path
        name: lot_id
        schema:
          type: string
          format: uuid
        required: true
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - lots
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLotEventList'
          description: ''
    post:
      operationId: lots_events_create
      parameters:
      - in: path
        name: lot_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - lots
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EventCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EventCreateRequest'
        required: true
      security:
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventCreate'
          description: ''
  /api/v1/lots/{lot_id}/verify-chain/:
    get:
      operationId: lots_verify_chain_retrieve
      parameters:
      - in: path
        name: lot_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - lots
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyChainResponse'
          description: ''
  /api/v1/planting-intents/:
    get:
      operationId: planting_intents_list
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - planting-intents
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedIntentList'
          description: ''
    post:
      operationId: planting_intents_create
      tags:
      - planting-intents
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntentCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/IntentCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/IntentCreateRequest'
        required: true
      security:
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentCreate'
          description: ''
  /api/v1/ussd/:
    post:
      operationId: ussd_create
      tags:
      - ussd
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UssdRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UssdRequestRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          description: Plain text starting with CON or END.
  /api/v1/verify/{token}/:
    get:
      operationId: verify_retrieve
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - verify
      security:
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyData'
          description: ''
  /api/v1/verify/{token}/confirm/:
    post:
      operationId: verify_confirm_create
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - verify
      security:
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyActionResponse'
          description: ''
  /api/v1/verify/{token}/dispute/:
    post:
      operationId: verify_dispute_create
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - verify
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisputeRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DisputeRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DisputeRequestRequest'
        required: true
      security:
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyActionResponse'
          description: ''
  /api/v1/wards/:
    get:
      operationId: wards_list
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - wards
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedWardList'
          description: ''
  /api/v1/wards/{ward_id}/slots/:
    get:
      operationId: wards_slots_list
      parameters:
      - in: query
        name: crop
        schema:
          type: string
          minLength: 1
        required: true
      - in: query
        name: season
        schema:
          type: string
          minLength: 1
      - in: path
        name: ward_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - wards
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Slot'
          description: ''
  /health:
    get:
      operationId: health_retrieve
      description: Public liveness check for uptime monitors.
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          description: ''
components:
  schemas:
    AdviceResponse:
      type: object
      properties:
        ward:
          $ref: '#/components/schemas/Ward'
        crop:
          type: string
        recommended_window:
          $ref: '#/components/schemas/SlotRef'
        confidence:
          type: number
          format: double
        rationale:
          type: string
        rule_set_version:
          type: string
        alternatives:
          type: array
          items:
            type: string
      required:
      - alternatives
      - confidence
      - crop
      - rationale
      - recommended_window
      - rule_set_version
      - ward
    AgentRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
      required:
      - id
      - name
    BlankEnum:
      enum:
      - ''
    Crop:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        code:
          type: string
          maxLength: 30
        name_en:
          type: string
          maxLength: 100
        name_sw:
          type: string
          maxLength: 100
        storable:
          type: boolean
      required:
      - code
      - id
      - name_en
      - name_sw
    DashboardCrop:
      type: object
      properties:
        crop:
          type: string
        intended_acres:
          type: number
          format: double
          nullable: true
        expected_demand_acres:
          type: number
          format: double
          nullable: true
        oversubscription_pct:
          type: number
          format: double
          nullable: true
        stored_stock_kg:
          type: number
          format: double
          nullable: true
        avg_loss_pct:
          type: number
          format: double
          nullable: true
        latest_price_per_kg_kes:
          type: number
          format: double
          nullable: true
        sell_flag:
          type: string
          nullable: true
        sell_flag_reason:
          type: string
        suppressed:
          type: boolean
      required:
      - avg_loss_pct
      - crop
      - expected_demand_acres
      - intended_acres
      - latest_price_per_kg_kes
      - oversubscription_pct
      - sell_flag
      - sell_flag_reason
      - stored_stock_kg
      - suppressed
    DashboardWardSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        county:
          type: string
        region:
          type: string
        crop_count:
          type: integer
        total_intended_acres:
          type: number
          format: double
        stored_stock_kg:
          type: number
          format: double
        generated_at:
          type: string
          format: date-time
      required:
      - county
      - crop_count
      - generated_at
      - id
      - name
      - region
      - stored_stock_kg
      - total_intended_acres
    DisputeRequestRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
      required:
      - reason
    EventCreate:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/TypeEnum'
        payload: {}
      required:
      - payload
      - type
    EventCreateRequest:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/TypeEnum'
        payload: {}
      required:
      - payload
      - type
    Farmer:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 150
        phone:
          type: string
          maxLength: 20
        ward:
          allOf:
          - $ref: '#/components/schemas/Ward'
          readOnly: true
        tenant_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        consent_given:
          type: boolean
        consent_at:
          type: string
          format: date-time
          nullable: true
        plots:
          type: array
          items:
            $ref: '#/components/schemas/Plot'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - phone
      - plots
      - tenant_id
      - ward
    FarmerCreate:
      type: object
      properties:
        name:
          type: string
          maxLength: 150
        phone:
          type: string
          maxLength: 20
        ward:
          type: string
          format: uuid
        consent_given:
          type: boolean
        consent_at:
          type: string
          format: date-time
          nullable: true
        create_login:
          type: boolean
          default: false
      required:
      - consent_given
      - name
      - phone
      - ward
    FarmerCreateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        phone:
          type: string
          minLength: 1
          maxLength: 20
        ward:
          type: string
          format: uuid
        consent_given:
          type: boolean
        consent_at:
          type: string
          format: date-time
          nullable: true
        create_login:
          type: boolean
          default: false
        password:
          type: string
          writeOnly: true
      required:
      - consent_given
      - name
      - phone
      - ward
    HealthResponse:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    Intent:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        farmer_id:
          type: string
          format: uuid
          readOnly: true
        plot_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        crop:
          type: string
          readOnly: true
        acres:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        season:
          type: string
          maxLength: 50
        slot:
          allOf:
          - $ref: '#/components/schemas/SlotRef'
          nullable: true
          readOnly: true
        oversubscribed:
          type: boolean
        warning:
          type: string
        alternatives: {}
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - acres
      - created_at
      - crop
      - farmer_id
      - id
      - plot_id
      - season
      - slot
    IntentCreate:
      type: object
      properties:
        farmer_id:
          type: string
          format: uuid
        plot_id:
          type: string
          format: uuid
          nullable: true
        crop:
          type: string
        acres:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        season:
          type: string
      required:
      - acres
      - crop
      - farmer_id
    IntentCreateRequest:
      type: object
      properties:
        farmer_id:
          type: string
          format: uuid
        plot_id:
          type: string
          format: uuid
          nullable: true
        crop:
          type: string
          minLength: 1
        acres:
          type: string
          format: decimal
