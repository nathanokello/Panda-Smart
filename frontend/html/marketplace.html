<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marketplace | Panda Smart</title>
  <link rel="icon" href="assets/panda-smart-logo.jpg"><link rel="stylesheet" href="css/styles.css">
  <script src="js/config.js"></script>
  <script src="js/api.js" defer></script>
  <script src="js/ui.js" defer></script>
  <script src="js/marketplace.js" defer></script>
</head>
<body class="dashboard-page">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main-area">
    <header class="topbar">
      <button class="menu-button" id="menuButton" type="button" aria-label="Toggle navigation">☰</button>
      <h1 class="page-title">Agricultural Marketplace</h1>
      <div class="topbar-right">
        <div class="user-summary">
          <div class="avatar" id="userAvatar">·</div>
          <div><strong id="userName">…</strong><small id="userRole"></small></div>
        </div>
      </div>
    </header>
    <section class="dashboard-content">
      <section class="two-col">
        <div class="panel" id="listingFormPanel" hidden>
          <h2>List your produce</h2>
          <form id="listingForm" class="form-grid">
            <div class="field">
              <label for="listingCrop">Crop</label>
              <select id="listingCrop" required></select>
            </div>
            <div class="field">
              <label for="listingLot">Hifadhi Mavuno lot (optional)</label>
              <select id="listingLot"><option value="">No lot selected</option></select>
            </div>
            <div class="field">
              <label for="listingQuantity">Quantity (kg)</label>
              <input id="listingQuantity" type="number" min="0.01" step="0.01" required>
            </div>
            <div class="field">
              <label for="listingPrice">Expected price (KES/kg)</label>
              <input id="listingPrice" type="number" min="0" step="0.01" required>
            </div>
            <div class="field full">
              <label for="listingDescription">Description</label>
              <textarea id="listingDescription" maxlength="2000" placeholder="Quality, harvest date, delivery options…"></textarea>
            </div>
            <div class="full">
              <p class="form-message" id="listingMessage" role="alert"></p>
              <button class="button button-primary" type="submit">Publish listing</button>
            </div>
          </form>
        </div>

        <div class="panel">
          <div class="toolbar">
            <h2 style="margin:0">Available produce</h2>
            <select id="listingCropFilter" aria-label="Filter marketplace by crop">
              <option value="">All crops</option>
            </select>
          </div>
          <div id="listingRows" class="listing-grid">
            <p class="muted">Loading listings…</p>
          </div>
        </div>
      </section>
    </section>
  </main>
</body>
</html>
