<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ward dashboard | Panda Smart</title>
  <link rel="icon" href="assets/panda-smart-logo.jpg"><link rel="stylesheet" href="css/styles.css">
  <script src="js/config.js"></script>
  <script src="js/api.js" defer></script>
  <script src="js/ui.js" defer></script>
  <script src="js/wards.js" defer></script>
</head>
<body class="dashboard-page">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main-area">
    <header class="topbar">
      <button class="menu-button" id="menuButton" type="button" aria-label="Toggle navigation">☰</button>
      <h1 class="page-title" id="pageTitle">Ward dashboard</h1>
      <div class="topbar-right">
        <div class="user-summary">
          <div class="avatar" id="userAvatar">·</div>
          <div><strong id="userName">…</strong><small id="userRole"></small></div>
        </div>
      </div>
    </header>
    <section class="dashboard-content">

      <section class="panel">
        <h2>Wards</h2>
        <div class="table-wrap"><table class="data-table">
          <thead><tr><th>Ward</th><th>County</th><th>Crops</th><th>Planned acres</th><th>Stored stock</th></tr></thead>
          <tbody id="wardRows"><tr><td colspan="5" class="empty-row">Loading…</td></tr></tbody>
        </table></div>
      </section>
      <section class="panel" id="wardDetail" style="margin-top:18px" hidden></section>
      <p class="data-note">Numbers are hidden for any crop with fewer than 5 farmers in a ward, so individual farmers can't be identified. Prices and rainfall come from the demo data files until live sources are connected.</p>
    </section>
  </main>
</body>
</html>
