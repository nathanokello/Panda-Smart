<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grain lot | Panda Smart</title>
  <link rel="icon" href="assets/panda-smart-logo.jpg"><link rel="stylesheet" href="css/styles.css">
  <script src="js/config.js"></script>
  <script src="js/api.js" defer></script>
  <script src="js/ui.js" defer></script>
  <script src="js/lot.js" defer></script>
</head>
<body class="dashboard-page">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main-area">
    <header class="topbar">
      <button class="menu-button" id="menuButton" type="button" aria-label="Toggle navigation">☰</button>
      <h1 class="page-title" id="pageTitle">Grain lot</h1>
      <div class="topbar-right">
        <div class="user-summary">
          <div class="avatar" id="userAvatar">·</div>
          <div><strong id="userName">…</strong><small id="userRole"></small></div>
        </div>
      </div>
    </header>
    <section class="dashboard-content">

      <p class="no-print"><a href="lots.html" class="muted">← All lots</a></p>
      <div class="two-col">
        <div class="stack">
          <section class="panel" id="lotHeader"><p class="muted">Loading…</p></section>
          <section class="panel" id="lossPanel"></section>
          <section class="panel">
            <div class="panel-heading-row"><h2>History</h2>
              <button class="button button-outline button-small no-print" id="chainButton" type="button" style="margin:0">Check record integrity</button></div>
            <p class="form-message" id="chainMessage" role="status"></p>
            <p class="muted small">Entries are never edited or deleted. A mistake is fixed by adding a correction.</p>
            <ol class="timeline" id="timeline"></ol>
          </section>
        </div>
        <div class="stack no-print">
          <section class="panel" id="eventPanel" hidden>
            <h2>Add a record</h2>
            <form id="eventForm" class="form-grid">
              <div class="field full"><label for="eType">What are you recording?</label>
                <select id="eType">
                  <option value="MOISTURE_READING">Moisture reading</option>
                  <option value="WEIGHT_READING">Weight reading</option>
                  <option value="CHECKUP">Check-up</option>
                  <option value="LOSS_RECORDED">Loss (with cause)</option>
                  <option value="CORRECTION">Correction to an earlier entry</option>
                </select></div>
              <div id="eFields" class="full form-grid"></div>
              <div class="full"><p class="form-message" id="eventMessage" role="alert"></p>
                <button class="button button-primary" type="submit">Save record</button></div>
            </form>
          </section>
          <section class="panel" id="linkPanel"></section>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
